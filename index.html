<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Drop a file</title>
<meta name="description" content="Encrypt and decrypt files in your browser. Nothing is uploaded.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="words.js" defer></script>
<script src="argon2.js" defer></script>
<script src="crypto.js" defer></script>
<script src="qr.js" defer></script>
<script src="sound.js" defer></script>
<script src="app.js" defer></script>
</head>
<body data-state="idle">
<p id="count" class="count" hidden></p>
<p id="note" class="note">Your files never leave your browser.</p>
<nav class="lang" aria-label="Language">
  <a id="src" href="https://github.com/veshka33/crypto_drop" target="_blank" rel="noopener noreferrer">code</a>
  <a id="info" href="how.html">info</a>
  <button id="fld" type="button">folder</button>
  <button id="snd" type="button" aria-pressed="false">sound</button>
  <button type="button" data-l="en" aria-pressed="true">en</button>
  <button type="button" data-l="uk" aria-pressed="false">uk</button>
  <button type="button" data-l="ru" aria-pressed="false">ru</button>
</nav>
<div class="eyes" id="eyes"><div class="eyes-in" id="eyesIn"><img src="eyes.jpg" alt="" width="400" height="400"></div></div>

<div class="speech">
  <p id="say" aria-hidden="true"></p>
  <div id="bar" class="bar" hidden></div>
  <input id="pw" type="password" aria-label="Password" autocomplete="off" enterkeyhint="go" tabindex="-1">
  <button id="suggest" class="ghost" type="button" hidden>suggest one</button>
  <button id="phrase" type="button" hidden></button>
  <div id="choice" class="choice" hidden>
    <button id="yes" class="ghost" type="button">yes</button>
    <button id="no" class="ghost" type="button">no</button>
  </div>
  <div id="actrow" class="choice" hidden>
    <button id="act" class="ghost" type="button">choose file</button>
    <button id="skip" class="ghost" type="button">skip</button>
  </div>
  <a id="out" hidden></a>
  <button id="textout" class="textout" type="button" hidden></button>
  <div id="extras" class="choice" hidden>
    <button id="share" class="ghost" type="button" hidden>share</button>
    <button id="qrbtn" class="ghost" type="button" hidden>qr</button>
  </div>
  <div id="qr" class="qr" hidden></div>
</div>

<div id="hands" class="hands" role="group" aria-label="Choose a passphrase">
  <img class="hands-img" src="hands.png" alt="" width="900" height="506">
</div>

<div id="chip" class="chip" aria-hidden="true"></div>
<button id="hand" class="hand" type="button" aria-label="Choose files to encrypt or decrypt">
  <span class="bob">
    <img class="open" src="hand.jpg" alt="" width="300" height="301">
    <img class="fist" src="fist.jpg" alt="" width="1024" height="1027">
  </span>
</button>

<p id="sr" class="sr" aria-live="polite"></p>
<input id="file" type="file" multiple hidden>
<input id="dir" type="file" webkitdirectory hidden>
<input id="keyfile" type="file" hidden>
</body>
</html>
